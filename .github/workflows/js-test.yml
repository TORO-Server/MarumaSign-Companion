name: js-test

# 3D 表示のスクリプトの試験 (src/test/js/reference-mesh.json は MarumaSign 本体の SignImage から作った基準データ。
# 本体側は core の SignVectorCheck が同じ形式のファイルを検査する。更新は --update と --companion で行う)
on:
  push:
    branches: [main]
    paths:
      - 'src/main/resources/web/**'
      - 'src/main/ts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'src/test/js/**'
      - '.github/workflows/js-test.yml'
  pull_request:
    paths:
      - 'src/main/resources/web/**'
      - 'src/main/ts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'src/test/js/**'
      - '.github/workflows/js-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: marumasign3d.js の試験 (基準データとの突き合わせを含む)
        run: |
          npm ci
          npm test
          git diff --exit-code -- src/main/resources/web/marumasign3d.js
