name: MarumaSignCompanion
version: '${version}'
main: net.torosaba.marumasign.companion.MarumaSignCompanion
api-version: '1.21'
description: Companion for servers using MarumaSign - indexes the signs, checks and hosts their links, and shows them on BlueMap (3D) and Dynmap
softdepend: [BlueMap, dynmap]
# hosting.storage: database のときに使う JDBC ドライバー (JAR に入れず、Paper が Maven Central から読み込む)
libraries:
  - com.mysql:mysql-connector-j:9.7.0
commands:
  marumasign:
    description: Status, rescan, reload, broken link and hosting tools for MarumaSign signs
    usage: /marumasign [status|rescan|reload|broken [page]|linkstatus|recheck <URL|all-broken>|hosting [status|list [page]|remove <id>|pending [page]|approve <key>|reject <key>]]
    permission: marumasign.admin
    aliases: [marumasignmap]
permissions:
  marumasign.admin:
    description: Use /marumasign
    default: op
  marumasignmap.admin:
    description: Old name of marumasign.admin (still accepted)
    default: op
    children:
      marumasign.admin: true
  bluemapmarumasign.admin:
    description: Old name of marumasign.admin (still accepted)
    default: op
    children:
      marumasign.admin: true
