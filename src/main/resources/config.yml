# MarumaSignCompanion の設定
# MarumaSign 形式の看板 (URL|X|Y|Z|横幅|高さ|Z回転|Y回転|X回転) を一覧にして、リンクを検査し、ホストし、BlueMap / Dynmap に出します。
# BlueMap / Dynmap がなくても、看板の一覧・リンクの検査・ホストは動きます。

# 地図ごとに出すかどうか (プラグインが入っていなければ、true でも何もしません)
bluemap:
  enabled: true
  # BlueMap での出し方
  #   3d      : 看板の画像を、MarumaSign 本体と同じ位置・大きさ・向きで 3D の空間に置く (既定)
  #   markers : これまでの HTML マーカー (サムネイル付き)
  #   both    : 両方
  mode: 3d
dynmap:
  enabled: true
  # Dynmap に出すワールド。空なら、Dynmap が地図を作る (worlds.txt で有効な) 読み込み済みのワールドすべて
  worlds: []
  # Dynmap の目的は、リンク切れの看板を見つけて直すこと。レイヤーは次の 3 つ (link-check が有効なとき):
  #   「MarumaSign リンク切れ」「MarumaSign 要確認」 と、show-ok が true のときだけ「MarumaSign 正常」。
  # 最初から隠しておく (Dynmap の画面の右上のレイヤーメニューでオンにする)。
  # オンにしても、地図に出るのはアイコンだけで、マウスを乗せると短い説明、クリックすると詳しい説明が開く。
  # link-check が無効なときは、従来どおり 1 つのレイヤー「MarumaSign」に全部出す。
  default-hidden: true
  # 「正常」のレイヤー (画像のサムネイル付き。件数が多くて重い) も作るか
  show-ok: false

# 1 つの地図 (Dynmap ではワールド) に出すマーカーの最大数 (超えた分は出しません)
max-markers: 5000

# マーカーにする URL の拡張子。ここにない拡張子の URL は出しません。
allowed-extensions:
  - png
  - apng
  - gif
  - jpg
  - jpeg
  - bmp
  - webp
  - tif
  - tiff
  - svg
  - svgz
  - ico
  - cur
  - ani
  - icns
  - psd
  - psb
  - tga
  - qoi
  - dds
  - ktx2
  - pcx
  - pbm
  - pgm
  - ppm
  - pnm
  - pam
  - pfm
  - sgi
  - rgb
  - ras
  - xbm
  - xpm
  - wbmp
  - ff
  - hdr
  - fits
  - avif
  - heic
  - heif
  - jxl
  - jp2
  - exr
  - dpx
  - iff
  - xwd
  - pgx
  - mp4
  - webm
  - mkv
  - mov
  - avi
  - m3u8
  - mpd
  - mp3
  - ogg
  - wav
  - flac
  - m4a
  - aac
  - opus
  - glb
  - gltf
  - ply
  - spz
  - sog
  - splat
  - ksplat
  - pdf
  - schem
  - litematic
  - nbt
  - mcstructure
  - schematic

# 拡張子のない URL (例: 画像の配信サービスの URL) を「リンク」のマーカーとして出すか
allow-no-extension: true

# 出さないホストを追加します (そのホストと、その下のサブドメイン)。
# 次のものは、ここに書かなくても常に出しません:
#   http / https 以外、localhost、127.x、10.x、172.16-31.x、192.168.x、169.254.x、100.64/10、
#   *.local / *.internal / *.lan / *.home.arpa、ドットのない名前、ブラウザーがつながない番号のポート
blocked-hosts: []

# リンク切れの検査。**サーバーが看板に書かれた URL へ、HEAD / GET で接続します** (プレイヤーが好きな URL を書けるので、
# 次の安全策をとっています。それでも、サーバーのアドレスが看板の URL の先のサイトに見えることは避けられません。不要なら enabled: false)。
#  - 接続するのは、名前を引いた全アドレスが公開アドレスのときだけ。検証したアドレスにだけつなぐ (DNS rebinding 対策)。転送も毎回やり直す
#  - 内部・予約済みのアドレス、80/443/8080/8443 以外のポート、ユーザー情報つきの URL は検査しない
#  - TLS の検証は緩めない。Cookie・認証・Referer は送らない。本文は 64 KB まで読んで捨てる。全体に期限がある
#  - 同時に検査するのは少数、同じホストには間隔を空け、全体・ホストごとの 1 時間あたりの上限がある
# 判定: 404/410・名前が引けない・接続拒否・証明書エラー・画像でなく HTML が返る・削除済みの置き換え画像・転送ループは BROKEN。
#       403 は「要確認」(ホットリンク対策のことがある)。タイムアウト・5xx は連続 3 回かつ 24 時間続いたときだけ BROKEN。
link-check:
  enabled: true
  # 同時に検査する数 (1-4)
  concurrency: 2
  # 起動してから検査を始めるまでの時間 (分。region の走査と重ならないように)
  startup-delay-minutes: 5
  # 全体の 1 時間あたりの検査の上限
  per-hour-limit: 600
  # 1 つのホストの 1 時間あたりの検査の上限 (看板を大量に作って、1 つのサイトに検査を集中させる攻撃を防ぐ)
  host-per-hour-limit: 60
  # 同じホストへの検査の間隔 (秒。少しゆらぎが入る)
  host-min-interval-seconds: 2
  timeouts:
    connect-seconds: 5
    total-seconds: 20
  # 本文を読む上限 (KB)。読んだら捨てる
  max-body-kb: 64
  max-redirects: 5
  recheck-ok-days: 7
  recheck-broken-hours: 24
  # UNKNOWN の再検査の間隔 (時間)。連続して失敗するほど長くなる
  unknown-backoff-hours: [6, 12, 24]
  # 一時的な失敗が、この回数・この時間 (最初の失敗から) 続いたら BROKEN にする
  broken-after-failures: 3
  broken-after-hours: 24
  # 403 を BROKEN にするか (false: 「要確認」)
  treat-403-as-broken: false
  # 追跡する URL の上限 (超えたら古い未検査から落とす)
  max-tracked-urls: 20000
  # 公開のアドレスに見えても、つながないアドレス・範囲 (「203.0.113.7」「198.51.100.0/24」「2001:db8::/32」)。
  # **サーバー自身の公開アドレスを書いてください**: 自分の公開アドレスへの接続は、同じ機械の中を通って、外から守られているはずのサービス
  # (管理画面など) に届くことがあります (Docker などで、プラグインから自分の公開アドレスが見えない場合は、これで除きます)。
  # サイトごとの NAT64 の範囲なども、ここに足せます。内部のアドレス (10/8 など) は、書かなくても常に除きます。
  extra-blocked-addresses: []
  # 送る User-Agent (印字できる ASCII だけ)
  user-agent: MarumaSignCompanion-LinkCheck/1.0
  # ホストごとの決まり (そのホストと下のサブドメイン)。min-interval-seconds は間隔を長くする。
  # removed-paths: 削除済みを 200 で返す置き換え画像のパス (そこへ転送されたら BROKEN)
  host-rules:
    - host: imgur.com
      min-interval-seconds: 5
      removed-paths:
        - /removed.png

# セキュリティ
security:
  # 看板の URL のホスト名を DNS で引いて、公開のアドレスを指すものだけ出す。
  # ホスト名が家庭内・社内のアドレス (192.168.x など) を指すように仕込まれていると、
  # 地図を見た人のブラウザーにそのアドレスを読ませることができてしまうため。引けるまでは出さない。
  dns-check: true

# 短縮 URL (is.gd など) は、3D 表示でブラウザーが直接画像を読めるように、サーバーで行き先を調べます。
# つなぐのは下のホストだけで、HEAD で転送先 (Location) を読むだけです。転送は自動で追わず、行き先のサーバーにはつなぎません。
# 行き先は URL の確認 (上の規則) を通ったものだけ使います。結果は plugins/MarumaSignCompanion/shortlinks.json に保存します。
short-links:
  resolve: true
  hosts:
    - is.gd
    - v.gd
    - x.gd

# 3D 表示 (Web 側のスクリプト) の設定
web3d:
  # 1 つの地図に出す看板の最大数
  max-signs: 20000
  # カメラからこの距離 (ブロック) 以内の看板だけ描く
  draw-distance: 192
  # 同時に描く画像の最大数 (多いと閲覧者の PC が重くなる)
  max-active: 200
  # 画像を読み込むときの最大の大きさ (ピクセル)。大きい画像はこの大きさに縮める
  texture-size: 1024
  # 画像の大きさ・位置のずれの上限 (ブロック)。看板には ±1000 まで書けるので、空を覆うような悪戯を防ぐ
  max-size: 64
  max-offset: 64
  # MarumaSign の看板の板 (看板ブロックそのもの) を地図から消す。MarumaSign 本体がゲームの中で板を隠すのと同じ見え方にする
  # (BlueMap が描いた地形のうち、看板のブロックの中の面だけを、閲覧者のブラウザーで消す。地図のデータは変えない)
  hide-sign-boards: true
  # 画像にできない看板 (動画・PDF・読み込めない画像など) に、種類と URL のラベルを出す
  show-labels: false

# 看板の URL の中身をサーバーでホストして、看板の URL をホスト先に書き換えます (既定は無効)。
#  - リンクの検査 (link-check) で正常だった URL が、verify-after-hours 以上たってから、もう一度読み込めたらホストします
#  - ライブ配信・分割配信 (m3u8 / mpd / Icecast / MJPEG など)、別のファイルを読む形式 (.gltf)、HTML、大きすぎるものはホストしません
#  - ホストしたら、その URL の看板の文字を、ホスト先の URL に書き換えます (URL より後ろの数値はそのまま。看板を読み込ませることはせず、
#    チャンクが読み込まれたときに書き換えます)。看板を書いた人の URL は hosting.json に残り、取り下げたときに戻します
#  - どの看板にも使われなくなってから unhost-after-days たったファイルは、ホストをやめて消します
#  - 管理者は /marumasign hosting remove <id> で取り下げられます (元の URL はもうホストせず、看板は元の URL に戻します)
# 公開するには、内蔵の Web サーバー (port) の前に HTTPS の逆プロキシ (Cloudflare Tunnel や nginx) を置き、そのアドレスを public-base-url にします。
# 外の Web サーバーに配らせるときは、port: 0 にして、directory をその Web サーバーの公開フォルダにします。
# storage: database では、ファイルも状態もデータベースに入れ、データベースを読む別の assets サーバーが配ります (内蔵の Web サーバーは使いません)。
hosting:
  enabled: false
  # 看板に書く URL の頭 (例 https://signs.example.net)。看板は文字数が限られるので短く (100 文字まで)。http(s) で、? # @ を含まない
  public-base-url: ""
  # files: このプラグインのフォルダ (または directory) と hosting.json。database: 下のデータベース (TiDB / MySQL) に入れ、内蔵の Web サーバーは使わない
  # files から database に変えると、最初の起動で hosting.json とフォルダのファイルをデータベースに取り込み、hosting.json を hosting.json.migrated にします (フォルダは消しません)
  storage: files
  database:
    # データベースがなければ作ります (表も)
    url: "jdbc:mysql://tidb:4000/marumasign"
    user: "root"
    password: ""
    # 表の名前の頭 (英数字と _ だけ)
    table-prefix: "msc_"
  client-check:
    # ホスト先を読める人を、いま遊んでいるプレイヤーの IP に絞るための記録 (storage: database のときだけ)
    enabled: true
    # assets サーバーと同じ秘密の文字列 (空なら記録しない)。IP はこれで HMAC-SHA256 にしてから保存する
    secret: ""
    # ログアウトしてからも読めるようにしておく時間 (分)。assets サーバーが使う
    grace-minutes: 10
  # ファイルを置くフォルダ (空ならこのプラグインのフォルダの hosted)。storage: database では、取り込むときに読むだけ
  directory: ""
  # 内蔵の Web サーバー。0 なら使わない (storage: database では使わない)
  bind: 0.0.0.0
  port: 8110
  # 正常と確かめてから、ホストするまでの時間 (時間)
  verify-after-hours: 24
  # どの看板にも使われなくなってから、ホストをやめるまでの日数
  unhost-after-days: 14
  # 1 つのファイルの上限と、全体の上限 (MB)
  max-file-mb: 32
  max-total-mb: 4096
  # 1 つのファイルを読み込む時間の上限 (秒)
  download-timeout-seconds: 120
  # 1 時間あたりに読み込む数の上限
  per-hour-limit: 30
  # ホストしないホスト (そのホストと、その下のサブドメイン)
  exclude-hosts: []

scan:
  # 看板を調べるワールド。空なら、読み込まれたワールドすべて (BlueMap / Dynmap が地図にするワールドは、ここになくても調べます)
  worlds: []
  # region ファイルを読むスレッドの数 (1-8)。増やすと速くなりますが、サーバーの負荷が上がります
  threads: 2
  # region ファイル 1 つを読むごとに空ける時間 (ミリ秒)
  pause-millis-per-region: 40
  # 更新された region ファイルだけをもう一度読む間隔 (分)。0 で起動時だけ
  rescan-interval-minutes: 30

marker:
  set-label: "MarumaSign"
  # 最初から隠しておく (マップ画面のメニューでオンにする)
  default-hidden: false
  # 画像のサムネイルの大きさ (ピクセル)
  thumbnail-size: 96
  # この距離 (ブロック) より遠いマーカーは隠します。0 で無制限
  max-distance: 600

# BlueMap が見つけられないときだけ、ワールド名 → region ディレクトリを指定します
# regions:
#   main: /path/to/region
